<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Redefinir senha | TV Score</title>
  <link rel="stylesheet" href="/redefinir-senha/tela.css">
  <script src="/redefinir-senha/tela.js" defer></script>
</head>
<body>
  <main class="painel">
    <p class="marca"><span aria-hidden="true">★</span> TV<b>Score</b></p>
    <h1>Redefinir senha</h1>
    <p class="descricao">Escolha a nova senha da sua conta TV Score.</p>
    <noscript>Ative o JavaScript no navegador para redefinir a senha.</noscript>
    <form id="formulario" method="post" hidden>
      <label for="nova-senha">Nova senha</label>
      <input id="nova-senha" type="password" autocomplete="new-password"
             aria-describedby="regra-senha" required>
      <p id="regra-senha" class="ajuda">Use de 8 a 72 bytes. Acentos e emojis podem contar como mais de um byte.</p>
      <label for="confirmacao">Confirme a nova senha</label>
      <input id="confirmacao" type="password" autocomplete="new-password" required>
      <button id="salvar" type="submit">Salvar nova senha</button>
    </form>
    <p id="mensagem" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
