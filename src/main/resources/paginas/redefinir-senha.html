<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Redefinir senha | TV Score</title>
  <link rel="stylesheet" href="/redefinir-senha/tela.css">
  <script src="/redefinir-senha/tela.js" defer></script>
</head>
<body>
  <div class="pagina">
    <main class="painel" aria-labelledby="titulo">
      <header class="capa">
        <img class="marca" src="/redefinir-senha/logo-tvscore.png" alt="TV Score" width="198" height="186">
      </header>
      <section class="conteudo">
        <h1 id="titulo">Redefinir senha</h1>
        <p class="descricao">Escolha uma nova senha para voltar à sua conta.</p>
        <noscript>Ative o JavaScript no navegador para redefinir a senha.</noscript>
        <form id="formulario" method="post" hidden>
          <label for="nova-senha">Nova senha</label>
          <input id="nova-senha" type="password" autocomplete="new-password"
                 aria-describedby="regra-senha" required>
          <p id="regra-senha" class="ajuda">A senha deve ter pelo menos 6 caracteres. São permitidos letras, inclusive acentuadas, números e símbolos especiais. Emojis não são permitidos.</p>
          <label for="confirmacao">Confirme a nova senha</label>
          <input id="confirmacao" type="password" autocomplete="new-password" required>
          <label class="visibilidade"><input id="mostrar-senhas" type="checkbox"> Mostrar senhas</label>
          <button id="salvar" type="submit">Salvar nova senha</button>
        </form>
        <p id="mensagem" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
</body>
</html>
