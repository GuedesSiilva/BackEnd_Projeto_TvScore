spring.application.name=tv_score
tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY}
tmdb.api.language=pt-BR
server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# SQL aplicado manualmente após preflight; não criar baseline/migrar banco existente ao iniciar.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:2592000}
recomendacao.api.url=${RECOMMENDATION_API_URL:http://localhost:8000}
recomendacao.api.timeout-ms=${RECOMMENDATION_TIMEOUT_MS:60000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
senha.reset.validade-segundos=${RESET_VALIDADE_SEGUNDOS:1200}
senha.reset.url=${RESET_URL:https://tvscore-backend.onrender.com/redefinir-senha}
senha.reset.remetente=${RESET_REMETENTE:no-reply@localhost}
senha.reset.email-habilitado=${RESET_EMAIL_HABILITADO:false}
senha.reset.resend-api-key=${RESEND_API_KEY:}
senha.reset.limite=${RESET_LIMITE:5}
senha.reset.janela-segundos=${RESET_JANELA_SEGUNDOS:900}
foto.storage=${FOTO_STORAGE:desabilitado}
foto.url-base=${FOTO_URL_BASE:http://localhost:8080/api/fotos}
foto.s3.endpoint=${FOTO_S3_ENDPOINT:}
foto.s3.regiao=${FOTO_S3_REGIAO:${AWS_REGION:us-east-1}}
foto.s3.bucket=${FOTO_S3_BUCKET:}
foto.local.diretorio=${FOTO_LOCAL_DIRETORIO:./fotos-dev}
catalogo.max-chamadas=${CATALOGO_MAX_CHAMADAS:6}
catalogo.prazo-ms=${CATALOGO_PRAZO_MS:10000}
catalogo.cursor.ttl-ms=${CATALOGO_CURSOR_TTL_MS:900000}
catalogo.resumo.ttl-segundos=${CATALOGO_RESUMO_TTL_SEGUNDOS:900}
catalogo.resumo.capacidade=${CATALOGO_RESUMO_CAPACIDADE:512}
episodios.prazo-ms=${EPISODIOS_PRAZO_MS:20000}
episodios.max-temporadas=${EPISODIOS_MAX_TEMPORADAS:100}
recomendacao.api.token-interno=${IA_INTERNAL_TOKEN:}
